<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VeilTrace AI — Uncover threats. Keep secrets."
    />
    <meta name="theme-color" content="#080F1C" />
    <title>VeilTrace AI — Uncover threats. Keep secrets.</title>
    <script>
      try {
        const theme = localStorage.getItem('veiltrace-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#F8FAFC' : '#080F1C';
      } catch (error) {
        console.warn('Unable to restore the saved theme preference.', error);
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
